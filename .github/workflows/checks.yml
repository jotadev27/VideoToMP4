name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff==0.15.22
      - name: Review public files
        run: python tools/check_public_tree.py
      - name: Check source style
        run: ruff check .
      - name: Test generated media conversions
        run: python -m unittest discover -s tests -v
